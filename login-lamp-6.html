<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login For Lamp</title>
<style>
:root{
  --bg-color:#121417;
  --lamp-state:#e8e2d9;
  --lamp-shade:#f5f0e6;
  --lamp-base:#d1cec2;
  --glow-color:rgba(255,214,110,.30);
  --accent-color:#d4a373;
  --on:0;
  --transition:.5s cubic-bezier(.4,0,.2,1);
}
*{margin:0;padding:0;box-sizing:border-box}

body{
  min-height:100vh;
  display:grid;
  place-items:center;
  background:var(--bg-color);
  color:#fff;
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  overflow:hidden;
  transition:background var(--transition);
  position:relative;
}

body::before{
  content:"";
  position:absolute;
  inset:0;
  background:radial-gradient(circle at 50% 40%,var(--glow-color),transparent 70%);
  opacity:var(--on);
  transition:opacity var(--transition);
  pointer-events:none;
}

.container{
  width:min(92vw,430px);
  text-align:center;
  position:relative;
  z-index:2;
}

.lamp-wrapper{
  width:300px;
  height:390px;
  margin:0 auto;
  position:relative;
  filter:drop-shadow(0 18px 30px rgba(0,0,0,.35));
}

.lamp-svg{
  width:100%;
  height:100%;
  overflow:visible;
}

.lamp-state{
  fill:var(--lamp-state);
  transition:fill var(--transition),filter var(--transition);
}

.lamp-shade{
  fill:var(--lamp-shade);
  transition:fill var(--transition),filter var(--transition);
}

.lamp-base{
  fill:var(--lamp-base);
}

.inner-glow{
  fill:rgba(255,214,110,.18);
  opacity:var(--on);
  transition:opacity var(--transition);
  filter:blur(2px);
}

.lamp-shade{
  filter:drop-shadow(0 0 calc(2px + 18px * var(--on)) rgba(255,214,110,.5));
}

.pull-cord{
  cursor:grab;
  touch-action:none;
}
.pull-cord:active{cursor:grabbing}
.cord-line{
  stroke:#b8b2a5;
  stroke-width:3;
  stroke-linecap:round;
}
.cord-bead{
  fill:var(--accent-color);
  transition:transform .15s ease;
}
.cord-hit{
  fill:transparent;
  pointer-events:all;
}

.hint{
  margin-top:-12px;
  color:#aaa;
  font-size:14px;
  letter-spacing:.2px;
  user-select:none;
}
.hint b{color:#ddd}

.status{
  margin:16px auto 0;
  display:inline-flex;
  align-items:center;
  gap:8px;
  padding:8px 14px;
  border:1px solid rgba(255,255,255,.1);
  border-radius:999px;
  background:rgba(255,255,255,.04);
  color:#aaa;
  font-size:13px;
  transition:all var(--transition);
}
.status-dot{
  width:8px;height:8px;border-radius:50%;
  background:#666;
  transition:all var(--transition);
}
body.on .status{
  color:#f1dfb8;
  border-color:rgba(255,214,110,.25);
}
body.on .status-dot{
  background:#ffd66e;
  box-shadow:0 0 12px #ffd66e;
}

.login-form{
  margin:28px auto 0;
  width:min(100%,350px);
  padding:22px;
  border-radius:18px;
  background:rgba(255,255,255,.045);
  border:1px solid rgba(255,255,255,.08);
  backdrop-filter:blur(12px);
}
.login-form h1{
  font-size:24px;
  margin-bottom:5px;
}
.login-form p{
  color:#8e9399;
  font-size:13px;
  margin-bottom:18px;
}
.field{
  text-align:left;
  margin-bottom:12px;
}
.field label{
  display:block;
  color:#aeb3ba;
  font-size:12px;
  margin-bottom:6px;
}
.field input{
  width:100%;
  padding:12px 13px;
  border-radius:10px;
  border:1px solid #30343a;
  outline:none;
  background:#191c20;
  color:#fff;
  font-size:14px;
}
.field input:focus{
  border-color:var(--accent-color);
  box-shadow:0 0 0 3px rgba(212,163,115,.12);
}
button{
  width:100%;
  border:0;
  border-radius:10px;
  padding:12px;
  margin-top:4px;
  background:var(--accent-color);
  color:#17130f;
  font-weight:700;
  cursor:pointer;
  transition:transform .15s ease,filter .2s ease;
}
button:hover{filter:brightness(1.08)}
button:active{transform:scale(.98)}
.message{
  min-height:18px;
  margin-top:12px;
  color:#b9b0a2;
  font-size:12px;
}

@media(max-height:700px){
  .lamp-wrapper{height:300px;width:230px}
  .login-form{margin-top:12px;padding:16px}
  .hint{margin-top:-8px}
}
</style>
</head>

<body data-on="false">
<main class="container">

  <div class="lamp-wrapper" aria-label="Interactive lamp">
    <svg class="lamp-svg" viewBox="0 0 200 300" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="lampGlow" cx="50%" cy="50%">
          <stop offset="0%" stop-color="#ffd66e" stop-opacity=".55"/>
          <stop offset="100%" stop-color="#ffd66e" stop-opacity="0"/>
        </radialGradient>
      </defs>

      <ellipse class="inner-glow" cx="100" cy="110" rx="60" ry="30" fill="url(#lampGlow)"/>

      <rect class="lamp-base" x="92" y="100" width="16" height="160" rx="8"/>
      <rect class="lamp-base" x="60" y="250" width="80" height="12" rx="6"/>

      <g class="pull-cord">
        <line class="cord-line" x1="130" y1="110" x2="130" y2="180"/>
        <circle class="cord-bead" cx="130" cy="190" r="6"/>
        <circle class="cord-hit" cx="130" cy="190" r="25"/>
      </g>

      <path class="lamp-shade"
        d="M30 110
           C30 50, 170 50, 170 110
           C170 125, 145 125, 145 125
           L55 125
           C55 125, 30 125, 30 110 Z"/>
    </svg>
  </div>

  <div class="hint">Pull the cord or press <b>Space</b> to toggle the lamp</div>

  <div class="status">
    <span class="status-dot"></span>
    <span id="statusText">Lamp is OFF</span>
  </div>

  <form class="login-form" id="loginForm">
    <h1>Login For Lamp</h1>
    <p>Turn on the lamp and sign in.</p>

    <div class="field">
      <label for="email">Email</label>
      <input id="email" type="email" placeholder="you@example.com" required>
    </div>

    <div class="field">
      <label for="password">Password</label>
      <input id="password" type="password" placeholder="••••••••" required>
    </div>

    <button type="submit">Sign In</button>
    <div class="message" id="message"></div>
  </form>
</main>

<script>
const root = document.documentElement;
const body = document.body;
const cordBead = document.querySelector(".cord-bead");
const cordLine = document.querySelector(".cord-line");
const hitArea = document.querySelector(".cord-hit");
const statusText = document.getElementById("statusText");
const loginForm = document.getElementById("loginForm");
const message = document.getElementById("message");

let isOn = false;
let dragging = false;

function setLamp(state){
  isOn = state;
  root.style.setProperty("--on", state ? "1" : "0");
  body.classList.toggle("on", state);
  body.dataset.on = String(state);
  statusText.textContent = state ? "Lamp is ON" : "Lamp is OFF";

  if(state){
    root.style.setProperty("--lamp-state","#fff1c9");
    root.style.setProperty("--lamp-shade","#fff8e8");
  }else{
    root.style.setProperty("--lamp-state","#e8e2d9");
    root.style.setProperty("--lamp-shade","#f5f0e6");
  }
}

function toggleLamp(){
  setLamp(!isOn);
  cordBead.style.transform = "translateY(8px)";
  setTimeout(() => cordBead.style.transform = "", 140);
}

hitArea.addEventListener("click", toggleLamp);

let startY = 0;
hitArea.addEventListener("pointerdown", e => {
  dragging = true;
  startY = e.clientY;
  hitArea.setPointerCapture(e.pointerId);
});

hitArea.addEventListener("pointermove", e => {
  if(!dragging) return;
  const dy = Math.max(0, Math.min(55, e.clientY - startY));
  cordBead.style.transform = `translateY(${dy}px)`;
  cordLine.setAttribute("y2", 180 + dy);
});

hitArea.addEventListener("pointerup", e => {
  if(!dragging) return;
  const dy = e.clientY - startY;
  dragging = false;
  cordBead.style.transform = "";
  cordLine.setAttribute("y2","180");
  if(dy > 12) toggleLamp();
});

document.addEventListener("keydown", e => {
  if(e.code === "Space" && !["INPUT","TEXTAREA","BUTTON"].includes(document.activeElement.tagName)){
    e.preventDefault();
    toggleLamp();
  }
});

loginForm.addEventListener("submit", e => {
  e.preventDefault();
  if(!isOn){
    message.textContent = "Please turn on the lamp first.";
    return;
  }
  message.textContent = "Demo login submitted successfully.";
});
</script>
</body>
</html>
